<script>
(() => {
  const root = document.getElementById("drivefix-chat-widget");
  if (!root || root.dataset.initialized === "true") return;
  root.dataset.initialized = "true";

    } catch (_) { return makeId(); }

  const userId = storedId("drivefixWidgetUserId");

    </button>
    <section class="df-panel" id="df-chat-panel" role="region" aria-label="Чат с AI-ассистентом автосервиса" hidden>
      <header class="df-header">
        <span class="df-brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>

        </div>
        <button class="df-close" type="button" aria-label="Закрыть чат">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="df-chat-body">
        <div class="df-transcript" role="log" aria-live="polite" aria-relevant="additions text" aria-label="Сообщения чата"></div>
      </div>
      <div class="df-composer">
        <div class="df-quick-bar">
          <p class="df-quick-heading">Быстрые действия</p>
          <button class="df-quick-toggle" type="button" aria-expanded="true" aria-controls="df-quick-actions">
            <span class="df-quick-toggle-label">Свернуть</span>
            <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 7.5 5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="df-actions" id="df-quick-actions" aria-label="Частые вопросы">
          <button class="df-action" type="button" data-prompt="Хочу записаться на ремонт"><span class="df-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M7.5 3.5v4m9-4v4M3.5 10h17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span class="df-action-label">Записаться на ремонт</span></button>
          <button class="df-action" type="button" data-prompt="Нужна диагностика автомобиля"><span class="df-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.8"/><path d="m15.5 15.5 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span><span class="df-action-label">Диагностика автомобиля</span></button>
          <button class="df-action" type="button" data-prompt="Хочу узнать стоимость услуг"><span class="df-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M20.5 13.2 13.2 20.5 3.5 10.8V3.5h7.3l9.7 9.7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="8.1" cy="8.1" r="1.2" fill="currentColor"/></svg></span><span class="df-action-label">Узнать стоимость</span></button>
          <button class="df-action" type="button" data-prompt="Нужен шиномонтаж"><span class="df-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2.4"/><circle cx="12" cy="12" r="6.25" stroke="currentColor" stroke-width="2.1"/><path d="M12 9.9V5.75m1.8 5.2 3.6-2.08m-3.6 4.16 3.6 2.08M12 14.1v4.15m-1.8-5.23-3.6 2.08m3.6-4.16-3.6-2.08" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"/><circle cx="12" cy="12" r="1.85" fill="currentColor"/></svg></span><span class="df-action-label">Шиномонтаж</span></button>
          <button class="df-action" type="button" data-prompt="Нужен ремонт двигателя"><span class="df-action-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 3.5h10v5.8l-1.4 4H8.4L7 9.3V3.5Z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M7 5.8h10M7 7.8h10" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"/><circle cx="12" cy="10.4" r="1.15" stroke="currentColor" stroke-width="1.5"/><path d="M10.8 12.7v4m2.4-4v4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="12" cy="19" r="2" stroke="currentColor" stroke-width="1.9"/></svg></span><span class="df-action-label">Ремонт двигателя</span></button>
        </div>
        <form class="df-form" novalidate>
          <div class="df-input-row">
            <textarea class="df-input" rows="1" maxlength="4000" placeholder="Опишите проблему с автомобилем…" aria-label="Сообщение для AI-ассистента"></textarea>
            <button class="df-send" type="submit" aria-label="Отправить сообщение" disabled>
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 3 10.8 13.2M21 3l-6.5 18-3.7-7.8L3 9.5 21 3Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <p class="df-footnote">Предварительная оценка не заменяет диагностику специалиста. Не вводите данные карт и пароли.</p>
        </form>
      </div>
    </section>
  `);

  const panel = root.querySelector(".df-panel");
  const launcher = root.querySelector(".df-launcher");
  const closeButton = root.querySelector(".df-close");
  const transcript = root.querySelector(".df-transcript");
  const form = root.querySelector(".df-form");
  const input = root.querySelector(".df-input");
  const sendButton = root.querySelector(".df-send");
  const quickToggle = root.querySelector(".df-quick-toggle");
  const quickActions = root.querySelector(".df-actions");
  const composer = root.querySelector(".df-composer");
  const actionButtons = [...root.querySelectorAll(".df-action")];
  root.querySelector(".df-brand-name").textContent = brand;

  const assistantIcon = `<span class="df-ai-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>`;
  let sending = false;
  let pendingNode = null;

  function scrollToLatest() { transcript.scrollTop = transcript.scrollHeight; }
  function addMessage(role, text, options = {}) {
    const message = document.createElement("article");
    message.className = `df-message df-message--${role}${options.pending ? " df-pending" : ""}`;
    if (role === "assistant") message.insertAdjacentHTML("beforeend", assistantIcon);
    const bubble = document.createElement("div");
    bubble.className = "df-bubble";
    const tag = document.createElement("span");
    tag.className = "df-message-tag";
    tag.textContent = role === "user" ? "Вы" : "AI · Автосервис";
    const copy = document.createElement("p");
    copy.className = "df-message-text";
    copy.textContent = text;
    bubble.append(tag, copy);
    if (options.pending) {
      const dots = document.createElement("span");
      dots.className = "df-typing-dots";
      dots.setAttribute("aria-hidden", "true");
      dots.innerHTML = "<i></i><i></i><i></i>";
      copy.append(dots);
    }
    if (options.retryText) {
      const retry = document.createElement("button");
      retry.className = "df-retry";
      retry.type = "button";
      retry.textContent = "Повторить отправку";
      retry.addEventListener("click", () => {
        message.remove();
        sendMessage(options.retryText, false);
      });
      bubble.append(retry);
    }
    message.append(bubble);
    transcript.append(message);
    scrollToLatest();
    return message;
  }

  function setBusy(value) {
    sending = value;
    input.disabled = value;
    sendButton.disabled = value || !input.value.trim();
    sendButton.setAttribute("aria-busy", String(value));
    actionButtons.forEach((button) => { button.disabled = value; });
  }

  function parseReply(raw, contentType) {
    if ((contentType || "").includes("application/json")) {
      try {
        const data = JSON.parse(raw);
        return String(data.output ?? data.text ?? data.response ?? data.message ?? "").trim();
      } catch (_) { /* fall through to plain text */ }
    }
    const text = String(raw || "").trim();
    if (text.startsWith("{") || text.startsWith("[")) {
      try {
        const data = JSON.parse(text);
        if (typeof data === "string") return data;
        return String(data.output ?? data.text ?? data.response ?? data.message ?? text).trim();
      } catch (_) { /* response is ordinary text */ }
    }
    return text;
  }

  async function sendMessage(rawText, showUserMessage = true) {
    const text = String(rawText || "").trim();
    if (!text || sending) return;
    if (showUserMessage) addMessage("user", text);
    input.value = "";
    input.style.height = "auto";
    setBusy(true);
    pendingNode = addMessage("assistant", "Подбираю ответ", { pending: true });
    const controller = new AbortController();
    const timeout = window.setTimeout(() => controller.abort(), 45000);
    try {
      const response = await fetch(webhook, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
        body: new URLSearchParams({ chatInput: text, userId, chatId }).toString(),
        signal: controller.signal,
      });
      const rawReply = await response.text();
      if (!response.ok) {
        const error = new Error("Webhook request failed");
        error.status = response.status;
        throw error;
      }
      const reply = parseReply(rawReply, response.headers.get("content-type"));
      pendingNode.remove();
      pendingNode = null;
      addMessage("assistant", reply || "Не удалось подготовить ответ. Попробуйте задать вопрос иначе.");
    } catch (error) {
      if (pendingNode) pendingNode.remove();
      pendingNode = null;
      const message = error?.status === 404
        ? "Webhook не найден. Проверьте production URL и публикацию workflow."
        : error?.name === "AbortError"
          ? "Автосервис долго не отвечает. Попробуйте отправить сообщение ещё раз."
          : "Не удалось связаться с автосервисом. Проверьте интернет и попробуйте ещё раз.";
      addMessage("assistant", message, { retryText: text });
    } finally {
      window.clearTimeout(timeout);
      setBusy(false);
      if (!panel.hidden) input.focus({ preventScroll: true });
      scrollToLatest();
    }
  }

  function openChat() {
    panel.hidden = false;
    root.classList.add("df-open");
    launcher.setAttribute("aria-expanded", "true");
    launcher.setAttribute("aria-label", "Свернуть чат DriveFix");
    launcher.setAttribute("aria-label", "Свернуть чат DriveFix");
    launcher.setAttribute("aria-label", "Свернуть чат DriveFix");
    launcher.setAttribute("aria-label", "Свернуть чат DriveFix");
    launcher.setAttribute("aria-label", "Свернуть чат DriveFix");
    launcher.setAttribute("aria-label", "Свернуть чат DriveFix");
    launcher.setAttribute("aria-label", "Свернуть чат DriveFix");
    launcher.setAttribute("aria-label", "Свернуть чат DriveFix");
    launcher.setAttribute("aria-label", "Свернуть чат DriveFix");
    launcher.setAttribute("aria-label", "Свернуть чат DriveFix");
    launcher.setAttribute("aria-label", "Свернуть чат DriveFix");
    launcher.setAttribute("aria-label", "Свернуть чат DriveFix");
    requestAnimationFrame(() => panel.classList.add("df-opening"));
    window.setTimeout(() => input.focus({ preventScroll: true }), 80);
  }
  function closeChat() {
    if (panel.hidden || panel.classList.contains("df-closing")) return;
    panel.classList.remove("df-opening");
    panel.classList.add("df-closing");
    const finishClose = () => {
      if (panel.hidden) return;
      panel.hidden = true;
      panel.classList.remove("df-closing");
      root.classList.remove("df-open");
      launcher.setAttribute("aria-expanded", "false");
      launcher.setAttribute("aria-label", "Открыть чат DriveFix");
      launcher.focus({ preventScroll: true });
    };
    const onCloseAnimation = (event) => {
      if (event.target !== panel || event.animationName !== "df-panel-out") return;
      window.clearTimeout(closeFallback);
      panel.removeEventListener("animationend", onCloseAnimation);
      finishClose();
    };
    panel.addEventListener("animationend", onCloseAnimation);
    const closeFallback = window.setTimeout(() => {
      panel.removeEventListener("animationend", onCloseAnimation);
      finishClose();
    }, 300);
  }

  launcher.addEventListener("click", () => panel.hidden ? openChat() : closeChat());
  closeButton.addEventListener("click", closeChat);
  quickToggle.addEventListener("click", () => {
    const expanded = quickToggle.getAttribute("aria-expanded") === "true";
    quickToggle.setAttribute("aria-expanded", String(!expanded));
    quickToggle.querySelector(".df-quick-toggle-label").textContent = expanded ? "Показать" : "Свернуть";
    quickActions.hidden = expanded;
    composer.classList.toggle("df-actions-collapsed", expanded);
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !panel.hidden && root.contains(document.activeElement)) closeChat();
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = `${Math.min(input.scrollHeight, 112)}px`;
    sendButton.disabled = sending || !input.value.trim();
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing && event.keyCode !== 229) {
      event.preventDefault();
      sendMessage(input.value);
    }
  });
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    sendMessage(input.value);
  });
  actionButtons.forEach((button) => button.addEventListener("click", () => sendMessage(button.dataset.prompt)));

  addMessage("assistant", "Здравствуйте! Я AI-помощник " + brand + ". Опишите, что случилось с автомобилем, — подскажу возможные причины и помогу записаться в сервис.");
})();
</script>
